<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntários - ONG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Junte-se à nossa Causa</h1>
        <form method="post"> <!-- O 'method' define como os dados viajam -->
            
            <fieldset>
                <legend>Informações Pessoais</legend>
                
                <!-- Aqui criamos o crachá de acessibilidade para este campo -->
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: Maria Silva">

                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" required>
            </fieldset>

            <fieldset>
                <legend>Sua Contribuição</legend>
                
                <label for="area">Área de Interesse:</label>
                <select id="area" name="area">
                    <optgroup label="Educação">
                        <option value="reforco">Reforço Escolar</option>
                        <option value="artes">Oficina de Artes</option>
                    </optgroup>
                    <optgroup label="Saúde">
                        <option value="apoio">Apoio Emocional</option>
                    </optgroup>
                </select>

                <label for="motivo">Por que você quer se unir a nós?</label>
                <!-- O placeholder ajuda o usuário a entender o que escrever -->
                <textarea id="motivo" name="motivo" rows="4" required placeholder="Conte-nos um pouco sobre sua motivação..."></textarea>
            </fieldset>

            <button type="submit">Enviar Cadastro de Impacto</button>
        </form>
    </main>
</body>
</html>
